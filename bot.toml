# Bot settings. Safe to commit: cookies and webhooks go in secrets.toml (gitignored)
# or env vars ESPN_S2, ESPN_SWID, DISCORD_WEBHOOK_URL. Env vars override this file.

[league]
league_id = 1826277500     # from the league URL: ...?leagueId=123456789
year = 2027                # ESPN names NBA seasons by the year they END in (2026-27 = 2027)
team_id = 3                # run `python -m fantasy_bot --list-teams` to find yours

[bot]
# Anyone on your roster can be suggested as a drop, except these.
# Names must match ESPN spelling.
untouchable = ["Cade Cunningham"]

max_moves = 2              # most add/drop suggestions per day (never more than the adds you have left)
options_shown = 10         # swaps listed in all: the picks above, then the next best on their own
streaming_spots = 2        # your weakest N players rotate whenever a pickup...
min_win_gain = 0.03        # ...adds this much to your chance of winning this week plus next (0.03 = 3 points)
projection_error = 0.15    # how far off a per game estimate typically is; widens the win chance spread
min_edge = 4.0             # everyone else is core: an add must out-score them by this many fpts per game
# Without matchup data (category leagues, byes) streaming falls back to fpts:
horizon_days = 7           # days ahead to count games
stream_min_gain = 10.0     # fpts a pickup must add over the horizon
min_games_without = 3      # games a backup must have played without the injured starter to count his new role
free_agent_pool = 300      # how many free agents to scan, by ownership
min_minutes_for_depth = 18 # an injured player must average this to open up a role
absorb_rate = 0.5          # share of an injured player's production backups pick up
dtd_availability = 0.6     # how much to discount day-to-day players
lineup_min_gain = 2.0      # fpts a better lineup must add today before the bot says to change yours

[hashtag]
# Scrapes hashtagbasketball.com/fantasy-basketball-rankings (free, every player)
# and attaches each player's 9-cat line and z-scores for these windows.
enabled = true
windows = ["season", "last_7", "last_14"]   # any of season, last_7, last_14, last_30
# save_dir = "data/hashtag"                 # uncomment to also save CSVs (plus dated copies)
# Category multipliers, as set on the page in your browser. The scrape starts from the site's
# defaults (STL and BLK x1), so set them here. Choices: 3, 2.5, 2, 1.5, 1.25, 1, 0.75, 0.5, 0.25.
# They change Hashtag's TOTAL and rank only; the bot values players on the per game stats.
multipliers = { "FG%" = 1, "FT%" = 1, "3PM" = 1, PTS = 1, REB = 1, AST = 1, STL = 1.25, BLK = 1.25, TO = 0.25 }

[weights]
# How much each split counts toward per game value. Lean on projections early
# in the season, then shift weight to last_7 and last_15 as samples grow.
last_7 = 0.35
last_15 = 0.20
season = 0.20
projected = 0.25
hashtag = 0.25             # Hashtag's per game stats scored with your league's points (points leagues only)

[trade]
# Trade scout: python -m fantasy_bot --trades
# Sells players playing above their rest of season value for players playing below theirs.
max_players = 2            # most players a side (1-for-1 up to 2-for-2)
min_gain = 3.0             # fpts per week a trade must add for you over the rest of the season
fairness = 0.0             # fpts per week a trade may look worse to the other team; below 0, the least it must help them too (-5: both gain 5+)
their_recent = 0.5         # how much the other manager goes by recent form: 1 = recent form only, 0 = rest of season only
shown = 5                  # trades listed
projection_games = 20      # ESPN's projection counts as this many real games in the rest of season value

[trade.weights]
# Rest of season value. Leans on the season and ESPN's projection, so a hot or cold couple
# of weeks is pulled back toward what a player was expected to do. The daily scout's
# [weights] above are the "now" value: recent form, which is what other managers go by.
last_7 = 0.0
last_15 = 0.10
season = 0.30
projected = 0.45
hashtag = 0.10             # Hashtag's season line in your scoring (points leagues only)
