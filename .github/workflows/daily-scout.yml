name: Daily fantasy scout

on:
  schedule:
    # 18:30 UTC = 7:30am in Auckland (NZDT) and early afternoon US Eastern,
    # after the morning NBA injury reports and before tip-off.
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # to save run history on the bot-data branch

concurrency:
  group: bot-data  # one run at a time writes to the data branch
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out run history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/load-data.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scout
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # league id, team and untouchables come from the committed bot.toml
        run: python -m fantasy_bot --data-dir data
      - name: Save run history
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/save-data.sh "daily scout"
